version: '3.8'

services:
  # ============================================
  # Backend API
  # ============================================
  backend:
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile
    container_name: airwatch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./airwatch.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - ./fastapi_app:/app
      - sqlite-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - airwatch-network

  # ============================================
  # Frontend (Nginx)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: airwatch-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    networks:
      - airwatch-network

  # ============================================
  # PostgreSQL (Optional - for production)
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: airwatch-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=airwatch
      - POSTGRES_PASSWORD=${DB_PASSWORD:-change-me}
      - POSTGRES_DB=airwatch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airwatch-network

  # ============================================
  # Redis (Optional - for caching)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: airwatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - airwatch-network

networks:
  airwatch-network:
    driver: bridge

volumes:
  sqlite-data:
  postgres-data:
  redis-data:
